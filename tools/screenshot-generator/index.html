<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convoy Radio - App Store Screenshot Generator (1290x2796)</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f141f;
      --border: #1e293b;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px;
    }
    .header {
      max-width: 1400px;
      margin: 0 auto 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .header-info h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .header-info p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .btn-download-all {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #07090e;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-download-all:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 242, 254, 0.4);
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 28px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 242, 254, 0.3);
    }
    .card-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-inputs label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
    }
    .card-inputs input, .card-inputs textarea {
      background: #0a0e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }
    .card-inputs textarea {
      resize: vertical;
      min-height: 48px;
    }
    .card-inputs input:focus, .card-inputs textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .dropzone {
      border: 2px dashed #2a374a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      background: rgba(10, 14, 23, 0.6);
      transition: all 0.2s ease;
      font-size: 12px;
      color: var(--text-muted);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.05);
      color: var(--accent);
    }
    .dropzone input {
      display: none;
    }
    .preview-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1290 / 2796;
      border: 1px solid #1e293b;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .btn-download-single {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      font-weight: 600;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .btn-download-single:hover {
      background: var(--accent);
      color: #07090e;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-info">
      <h1>Convoy Radio - App Store Screenshot Studio</h1>
      <p>Generates Apple App Store screenshots in both Medium Display (1179x2556) and Large Display (1290x2796).</p>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn-download-all" id="btnDownloadAllMedium" style="background:linear-gradient(135deg, #22c55e, #10b981);">Download All (1179x2556 - Medium Display)</button>
      <button class="btn-download-all" id="btnDownloadAllLarge">Download All (1290x2796 - Large Display)</button>
    </div>
  </div>

  <div class="grid" id="cardsGrid"></div>

  <script>
    const CONFIGS = [
      {
        id: 1,
        badge: "REAL-TIME PTT AUDIO",
        title: "INSTANT CONVOY TALK",
        subtitle: "Ultra-low latency push-to-talk voice radio with cockpit speed telemetry.",
        mockTitle: "CONVOY RADIO",
        mockSub: "ROOM 404 • 5 DRIVERS ACTIVE",
        mockColor: "#00f2fe",
      },
      {
        id: 2,
        badge: "LIVE GPS RADAR",
        title: "REAL-TIME CONVOY MAP",
        subtitle: "Pinpoint fellow drivers on the live map with real-time vector distance.",
        mockTitle: "LIVE MAP",
        mockSub: "NORTHBOUND HIGHWAY • 3.2 KM AHEAD",
        mockColor: "#38bdf8",
      },
      {
        id: 3,
        badge: "FLEET MANAGEMENT",
        title: "SMART DRIVER RADAR",
        subtitle: "See who is transmitting instantly with live signal bars & moderation.",
        mockTitle: "DRIVERS FLEET",
        mockSub: "SIGNAL EXCELLENT • 0 MSEC DELAY",
        mockColor: "#22c55e",
      },
      {
        id: 4,
        badge: "CUSTOM RIGS & CHIMES",
        title: "CUSTOMIZE YOUR RIDE",
        subtitle: "Choose custom vehicle types, callsign colors, and roger beep chimes.",
        mockTitle: "RIG SETUP",
        mockSub: "SEMI TRUCK • NEON CYAN • CHIME ON",
        mockColor: "#a855f7",
      }
    ];

    const userImages = {};

    function renderCards() {
      const container = document.getElementById('cardsGrid');
      container.innerHTML = '';

      CONFIGS.forEach((cfg) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="card-badge">${cfg.badge}</span>
            <span style="font-size:12px;color:var(--text-muted);font-weight:700;">#${cfg.id} OF 4</span>
          </div>

          <div class="card-inputs">
            <label>Tagline Badge</label>
            <input type="text" id="badge-${cfg.id}" value="${cfg.badge}">
            <label>Headline</label>
            <input type="text" id="title-${cfg.id}" value="${cfg.title}">
            <label>Subtitle</label>
            <textarea id="sub-${cfg.id}">${cfg.subtitle}</textarea>
          </div>

          <div class="dropzone" id="dropzone-${cfg.id}">
            Drop your screenshot here (or click to upload)
            <input type="file" id="file-${cfg.id}" accept="image/*">
          </div>

          <div class="preview-container">
            <canvas id="canvas-${cfg.id}" width="1290" height="2796"></canvas>
          </div>

          <div style="display:flex;gap:8px;flex-direction:column;">
            <button class="btn-download-single" id="btn-dl-med-${cfg.id}" style="background:#166534;border-color:#22c55e;">Download 1179x2556 (Medium Display)</button>
            <button class="btn-download-single" id="btn-dl-lg-${cfg.id}">Download 1290x2796 (Large Display)</button>
          </div>
        `;
        container.appendChild(card);

        // Events
        const fileInput = card.querySelector(`#file-${cfg.id}`);
        const dropzone = card.querySelector(`#dropzone-${cfg.id}`);
        const badgeInput = card.querySelector(`#badge-${cfg.id}`);
        const titleInput = card.querySelector(`#title-${cfg.id}`);
        const subInput = card.querySelector(`#sub-${cfg.id}`);
        const dlMedBtn = card.querySelector(`#btn-dl-med-${cfg.id}`);
        const dlLgBtn = card.querySelector(`#btn-dl-lg-${cfg.id}`);

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleImageFile(cfg.id, e.dataTransfer.files[0]);
          }
        });
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            handleImageFile(cfg.id, e.target.files[0]);
          }
        });

        [badgeInput, titleInput, subInput].forEach(inp => {
          inp.addEventListener('input', () => drawCanvas(cfg.id));
        });

        dlMedBtn.addEventListener('click', () => downloadCanvas(cfg.id, 1179, 2556));
        dlLgBtn.addEventListener('click', () => downloadCanvas(cfg.id, 1290, 2796));
      });

      // Initial draw
      CONFIGS.forEach(cfg => drawCanvas(cfg.id));
    }

    function handleImageFile(id, file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          userImages[id] = img;
          drawCanvas(id);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function drawCanvas(id) {
      const cfg = CONFIGS.find(c => c.id === id);
      const canvas = document.getElementById(`canvas-${id}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = 1290;
      const h = 2796;

      const badgeText = (document.getElementById(`badge-${id}`)?.value || cfg.badge).toUpperCase();
      const titleText = (document.getElementById(`title-${id}`)?.value || cfg.title).toUpperCase();
      const subText = document.getElementById(`sub-${id}`)?.value || cfg.subtitle;

      // 1. Background Gradient (Cyber Deep Navy to Pitch Obsidian)
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#0c1322');
      bgGrad.addColorStop(0.35, '#070a12');
      bgGrad.addColorStop(1, '#030508');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Ambient Accent Glow
      const glowGrad = ctx.createRadialGradient(w / 2, 280, 20, w / 2, 280, 650);
      glowGrad.addColorStop(0, 'rgba(0, 242, 254, 0.22)');
      glowGrad.addColorStop(0.6, 'rgba(0, 242, 254, 0.04)');
      glowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, w, 1100);

      // Subtle Cyber Grid Pattern
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;
      const gridSize = 80;
      for (let x = 0; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 900);
        ctx.stroke();
      }
      for (let y = 0; y < 900; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 3. Top Tagline Badge
      ctx.save();
      ctx.font = '800 36px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
      const badgeMetrics = ctx.measureText(badgeText);
      const badgeW = badgeMetrics.width + 60;
      const badgeH = 72;
      const badgeX = (w - badgeW) / 2;
      const badgeY = 160;

      // Badge pill background
      ctx.fillStyle = 'rgba(0, 242, 254, 0.12)';
      ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
      ctx.lineWidth = 2;
      drawRoundedRect(ctx, badgeX, badgeY, badgeW, badgeH, 36);
      ctx.fill();
      ctx.stroke();

      // Badge text
      ctx.fillStyle = '#00f2fe';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, w / 2, badgeY + badgeH / 2);
      ctx.restore();

      // 4. Main Headline
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 242, 254, 0.4)';
      ctx.shadowBlur = 30;
      ctx.font = '900 86px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
      ctx.fillText(titleText, w / 2, 330);
      ctx.restore();

      // 5. Subtitle
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '500 42px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
      ctx.fillStyle = '#94a3b8';
      wrapText(ctx, subText, w / 2, 415, 1020, 56);
      ctx.restore();

      // 6. iPhone Frame Mockup
      const frameX = 110;
      const frameY = 560;
      const frameW = w - (frameX * 2); // 1070px
      const frameH = h - frameY + 200; // Extends below bottom for elegant bleed
      const radius = 110;

      // Outer Frame Drop Shadow
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 80;
      ctx.shadowOffsetY = 35;

      // Titanium Chassis Outer
      ctx.fillStyle = '#1e2430';
      drawRoundedRect(ctx, frameX, frameY, frameW, frameH, radius);
      ctx.fill();
      ctx.restore();

      // Titanium Outer Border
      ctx.save();
      const borderGrad = ctx.createLinearGradient(frameX, frameY, frameX + frameW, frameY + frameH);
      borderGrad.addColorStop(0, '#475569');
      borderGrad.addColorStop(0.5, '#1e293b');
      borderGrad.addColorStop(1, '#334155');
      ctx.strokeStyle = borderGrad;
      ctx.lineWidth = 14;
      drawRoundedRect(ctx, frameX, frameY, frameW, frameH, radius);
      ctx.stroke();
      ctx.restore();

      // Inner Screen Bezel (Black Glass)
      const bezel = 22;
      const screenX = frameX + bezel;
      const screenY = frameY + bezel;
      const screenW = frameW - (bezel * 2);
      const screenH = frameH - (bezel * 2);
      const screenRadius = radius - bezel;

      ctx.save();
      drawRoundedRect(ctx, screenX, screenY, screenW, screenH, screenRadius);
      ctx.clip();

      // Screen Content: User Image or Polished Fallback UI
      if (userImages[id]) {
        const img = userImages[id];
        // Draw image covering screen area
        ctx.drawImage(img, screenX, screenY, screenW, screenH);
      } else {
        // Draw Sleek Placeholder Mockup UI
        drawMockupPlaceholder(ctx, screenX, screenY, screenW, screenH, cfg);
      }

      // Dynamic Island
      const diW = 280;
      const diH = 68;
      const diX = screenX + (screenW - diW) / 2;
      const diY = screenY + 26;
      ctx.fillStyle = '#000000';
      drawRoundedRect(ctx, diX, diY, diW, diH, 34);
      ctx.fill();

      // Screen Gloss Reflection Highlight
      const glossGrad = ctx.createLinearGradient(screenX, screenY, screenX + screenW, screenY + 600);
      glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
      glossGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.02)');
      glossGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glossGrad;
      ctx.fillRect(screenX, screenY, screenW, 500);

      ctx.restore();
    }

    function drawMockupPlaceholder(ctx, x, y, w, h, cfg) {
      // Dark Dashboard Background
      const screenGrad = ctx.createLinearGradient(x, y, x, y + h);
      screenGrad.addColorStop(0, '#0b0f19');
      screenGrad.addColorStop(1, '#05070c');
      ctx.fillStyle = screenGrad;
      ctx.fillRect(x, y, w, h);

      // App Header Bar
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x, y + 120, w, 110);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y + 120, w, 110);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 36px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(cfg.mockTitle, x + 50, y + 190);

      ctx.fillStyle = cfg.mockColor;
      ctx.font = '700 22px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('ONLINE', x + w - 50, y + 190);

      // Large Visual Circle (e.g., PTT Dial or Radar)
      const centerX = x + w / 2;
      const centerY = y + 700;
      const radius = 220;

      // Outer Dial Glow
      ctx.save();
      ctx.shadowColor = cfg.mockColor;
      ctx.shadowBlur = 60;
      ctx.strokeStyle = cfg.mockColor;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Inner Button Face
      const dialGrad = ctx.createRadialGradient(centerX, centerY, 30, centerX, centerY, radius);
      dialGrad.addColorStop(0, '#1e293b');
      dialGrad.addColorStop(1, '#090d16');
      ctx.fillStyle = dialGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 8, 0, Math.PI * 2);
      ctx.fill();

      // Dial Center Text
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '900 48px -apple-system, sans-serif';
      ctx.fillText(cfg.id === 1 ? 'PUSH TO TALK' : cfg.id === 2 ? 'MAP RADAR' : cfg.id === 3 ? '5 DRIVERS' : 'TRIP READY', centerX, centerY + 16);

      // Bottom Status Card
      const cardW = w - 100;
      const cardH = 260;
      const cardX = x + 50;
      const cardY = y + 1040;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 28);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 26px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cfg.mockSub, cardX + cardW / 2, cardY + 90);

      ctx.fillStyle = 'rgba(0, 242, 254, 0.15)';
      drawRoundedRect(ctx, cardX + 50, cardY + 140, cardW - 100, 70, 20);
      ctx.fill();

      ctx.fillStyle = '#00f2fe';
      ctx.font = '700 28px -apple-system, sans-serif';
      ctx.fillText('DROP YOUR ACTUAL SCREENSHOT ABOVE', cardX + cardW / 2, cardY + 185);
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let curY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, curY);
          line = words[n] + ' ';
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, curY);
    }

    function downloadCanvas(id, targetW = 1179, targetH = 2556) {
      const srcCanvas = document.getElementById(`canvas-${id}`);
      if (!srcCanvas) return;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = targetW;
      outCanvas.height = targetH;
      const ctx = outCanvas.getContext('2d');
      ctx.drawImage(srcCanvas, 0, 0, targetW, targetH);

      const link = document.createElement('a');
      link.download = `ConvoyRadio_${targetW}x${targetH}_0${id}.png`;
      link.href = outCanvas.toDataURL('image/png');
      link.click();
    }

    document.getElementById('btnDownloadAllMedium').addEventListener('click', () => {
      CONFIGS.forEach((cfg, idx) => {
        setTimeout(() => downloadCanvas(cfg.id, 1179, 2556), idx * 400);
      });
    });

    document.getElementById('btnDownloadAllLarge').addEventListener('click', () => {
      CONFIGS.forEach((cfg, idx) => {
        setTimeout(() => downloadCanvas(cfg.id, 1290, 2796), idx * 400);
      });
    });

    // Start
    renderCards();
  </script>
</body>
</html>
