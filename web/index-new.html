<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f4f8">
    <title>🚗 Konvoy Telsiz</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #0c4a6e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .screen {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #0c4a6e;
        }

        .header p {
            color: #64748b;
            font-size: 16px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 18px;
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            color: #0f172a;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #0ea5e9;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        #room-screen {
            display: none;
        }

        .room-info {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 900;
            color: #0c4a6e;
        }

        .ptt-button {
            width: 240px;
            height: 240px;
            margin: 32px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 8px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 12px 40px rgba(220, 38, 38, 0.4), 0 0 0 12px rgba(220, 38, 38, 0.1);
            transition: all 0.15s;
        }

        .ptt-button:active,
        .ptt-button.active {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            box-shadow: 0 16px 50px rgba(22, 163, 74, 0.5), 0 0 0 12px rgba(22, 163, 74, 0.15);
            transform: scale(0.94);
        }

        .ptt-emoji {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .ptt-text {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .ptt-hint {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            color: #64748b;
            font-weight: 700;
        }

        #speakers {
            margin: 24px 0;
            min-height: 60px;
        }

        .speaker-item {
            padding: 16px 20px;
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border-left: 5px solid #16a34a;
            border-radius: 14px;
            margin-bottom: 10px;
            font-weight: 800;
            color: #166534;
            font-size: 17px;
            animation: pulse 1.2s infinite;
        }

        .no-speaker {
            padding: 16px;
            text-align: center;
            color: #94a3b8;
            font-weight: 700;
            font-size: 15px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        #status {
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            margin-top: 20px;
            color: #1e40af;
        }

        .disconnect-btn {
            margin-top: 20px;
            background: #fff;
            border: 3px solid #ef4444;
            color: #dc2626;
            font-weight: 800;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.2);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: #0ea5e9;
            font-weight: 700;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .ptt-button {
                width: 220px;
                height: 220px;
            }
            .ptt-emoji {
                font-size: 72px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-screen" class="screen">
            <div class="header">
                <h1>🚗 Konvoy Telsiz</h1>
                <p>Araç içi iletişim sistemi</p>
            </div>
            <input type="text" id="name-input" placeholder="İsminiz (örn: Sürücü 1)" autocomplete="off">
            <button class="btn" id="join-btn">Konvoya Katıl</button>
            <div class="loading" id="loading">⏳ Bağlanıyor...</div>
        </div>

        <div id="room-screen" class="screen">
            <div class="header">
                <h1>🚗 Konvoy Kanalı</h1>
                <p>Bağlı: <span id="user-name"></span></p>
            </div>

            <div class="room-info">
                <div class="info-item">
                    <div class="info-label">KATILIMCI</div>
                    <div class="info-value">👥 <span id="participant-count">0</span></div>
                </div>
            </div>

            <div id="speakers">
                <div class="no-speaker">Kimse konuşmuyor</div>
            </div>

            <div class="ptt-button" id="ptt-btn">
                <div class="ptt-emoji" id="ptt-emoji">🎤</div>
                <div class="ptt-text" id="ptt-text">BAS & KONUŞ</div>
            </div>
            <div class="ptt-hint" id="ptt-hint">Basılı tutarak konuşun</div>

            <div id="status">✅ Bağlı</div>
            
            <button class="btn disconnect-btn" id="disconnect-btn">Konvoydan Ayrıl</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
    <script>
        const LivekitClient = window.LivekitClient || window.LiveKit || window;
        const BACKEND_URL = window.location.origin;
        
        let room = null;
        let isSpeaking = false;
        let localAudioTrack = null;
        let participants = new Map();

        const loginScreen = document.getElementById('login-screen');
        const roomScreen = document.getElementById('room-screen');
        const nameInput = document.getElementById('name-input');
        const joinBtn = document.getElementById('join-btn');
        const loading = document.getElementById('loading');
        const userName = document.getElementById('user-name');
        const participantCount = document.getElementById('participant-count');
        const speakersDiv = document.getElementById('speakers');
        const pttBtn = document.getElementById('ptt-btn');
        const pttEmoji = document.getElementById('ptt-emoji');
        const pttText = document.getElementById('ptt-text');
        const pttHint = document.getElementById('ptt-hint');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const status = document.getElementById('status');

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock aktif');
                }
            } catch (err) {
                console.error('Wake Lock hatası:', err);
            }
        }

        joinBtn.addEventListener('click', joinRoom);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });

        async function joinRoom() {
            const name = nameInput.value.trim();
            if (!name) {
                alert('Lütfen isminizi girin');
                return;
            }

            joinBtn.disabled = true;
            loading.style.display = 'block';
            status.textContent = '🔄 Bağlanıyor...';

            try {
                const response = await fetch(`${BACKEND_URL}/token?participantName=${encodeURIComponent(name)}`);
                const data = await response.json();
                
                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                room.on('participantConnected', updateParticipants);
                room.on('participantDisconnected', updateParticipants);
                room.on('trackSubscribed', handleTrackSubscribed);
                room.on('trackUnsubscribed', handleTrackUnsubscribed);
                room.on('activeSpeakersChanged', updateSpeakers);

                await room.connect(data.wsUrl, data.token);
                
                localAudioTrack = await LivekitClient.createLocalAudioTrack();
                await room.localParticipant.publishTrack(localAudioTrack, { name: 'microphone' });
                localAudioTrack.mute();

                userName.textContent = name;
                loginScreen.style.display = 'none';
                roomScreen.style.display = 'block';
                updateParticipants();
                
                await requestWakeLock();
                status.textContent = '✅ Bağlı';

            } catch (error) {
                alert('Bağlantı hatası: ' + error.message);
                loading.style.display = 'none';
                joinBtn.disabled = false;
                status.textContent = '❌ Hata';
            }
        }

        pttBtn.addEventListener('mousedown', startSpeaking);
        pttBtn.addEventListener('mouseup', stopSpeaking);
        pttBtn.addEventListener('mouseleave', stopSpeaking);
        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startSpeaking();
        });
        pttBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopSpeaking();
        });

        async function startSpeaking() {
            if (!localAudioTrack || isSpeaking) return;
            isSpeaking = true;
            await localAudioTrack.unmute();
            
            pttBtn.classList.add('active');
            pttEmoji.textContent = '🔴';
            pttText.textContent = 'KONUŞUYORSUNUZ';
            pttHint.textContent = 'Bırakarak susun';
            status.textContent = '🎤 Konuşuyor...';
        }

        async function stopSpeaking() {
            if (!localAudioTrack || !isSpeaking) return;
            isSpeaking = false;
            await localAudioTrack.mute();
            
            pttBtn.classList.remove('active');
            pttEmoji.textContent = '🎤';
            pttText.textContent = 'BAS & KONUŞ';
            pttHint.textContent = 'Basılı tutarak konuşun';
            status.textContent = '✅ Bağlı';
        }

        function updateParticipants() {
            if (!room || !room.participants) return;
            const count = room.participants.size + 1;
            participantCount.textContent = count;
        }

        function updateSpeakers(speakers) {
            speakersDiv.innerHTML = '';
            
            const activeSpeakers = speakers.filter(p => !p.isLocal && p.isSpeaking);
            
            if (activeSpeakers.length === 0) {
                speakersDiv.innerHTML = '<div class="no-speaker">Kimse konuşmuyor</div>';
                return;
            }

            activeSpeakers.forEach(speaker => {
                const div = document.createElement('div');
                div.className = 'speaker-item';
                div.textContent = `🔊 ${speaker.name || speaker.identity}`;
                speakersDiv.appendChild(div);
            });
        }

        function handleTrackSubscribed(track, publication, participant) {
            if (track.kind === 'audio') {
                const audioElement = track.attach();
                audioElement.play();
                participants.set(participant.sid, audioElement);
            }
        }

        function handleTrackUnsubscribed(track, publication, participant) {
            if (track.kind === 'audio') {
                const audioElement = participants.get(participant.sid);
                if (audioElement) {
                    audioElement.remove();
                    participants.delete(participant.sid);
                }
            }
        }

        disconnectBtn.addEventListener('click', () => {
            if (room) {
                room.disconnect();
            }
            if (wakeLock) {
                wakeLock.release();
            }
            location.reload();
        });
    </script>
</body>
</html>
